[project]
name = "floorplan-generator"
version = "0.1.0"
description = "Parameterized floorplan generator for ROS2 Stage simulator"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "shapely>=2.0.0",
    "numpy>=1.26.0",
    "pillow>=10.0.0",
]

[project.scripts]
floorplan-generator = "floorplan_generator.main:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors (flake8)
    "W",    # pycodestyle warnings (flake8)
    "F",    # pyflakes (flake8)
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "N",    # pep8-naming
    "RUF",  # Ruff-specific rules
    "D",    # pydocstyle
    "NPY",  # numpy
    "PD",   # pandas-vet
    "PERF", # perflint
]

ignore = [
    "E203",  # Whitespace before ':' (conflicts with Black)
    "D203",  # New line before docstring (conflicts with D211)
    "D212",  # First line of docstring on same line as """ (conflicts with D213)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.13"

check_untyped_defs = true

disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_untyped_decorators = true
disallow_any_generics = true
strict_equality = true
strict_bytes = true

warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
